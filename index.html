<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adăugare produs</title>
</head>
<body>

    <h1>Adăugați un produs nou</h1>

    <form action="/add_product" method="POST">
        <label for="name">Nume produs:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="price">Preț:</label><br>
        <input type="number" id="price" name="price" required><br><br>

        <button type="submit">Adăugați produsul</button>
    </form>

    <h2>Produse existente:</h2>

    <ul>
        {% for product in products %}
        <li>
            {{ product.name }} - {{ product.price }} RON
            <button type="button" onclick="deleteProduct({ product.id })">
                Șterge
            </button>
        </li>
        {% endfor %}
    </ul>

    <script>
        function deleteProduct(productId) {
            fetch(`/products/${productId}`, {
                method: 'DELETE'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.message === "Product deleted") {
                        alert("Produsul a fost șters!");
                        location.reload(); // Reîncarcă pagina
                    } else {
                        alert("Produsul nu a fost găsit.");
                    }
                })
                .catch(error => console.error('Eroare:', error));
        }
    </script>

</body>
</html>
